# The check through the shared CI library. This repository is public, so it runs on GitHub's
# runners: a pull request runs `just check`, a push to dev `just verify`.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
    permissions:
      contents: read
