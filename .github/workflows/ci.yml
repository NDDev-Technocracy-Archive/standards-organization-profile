# The check through the shared CI library. This repository is public, so it runs on GitHub's
# runners: a pull request runs `just check`, a push to dev `just verify`.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@d9fbe93b75c105a99632ebbd9d70901404303acd # v0.6.80
    permissions:
      contents: read
